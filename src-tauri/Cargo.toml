[package]
name = "itsd"
version = "0.2.4"
edition = "2021"

[lib]
name = "itsd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros"] }
tempfile = "3"
serde_json = "1"
fontdb = "0.23"